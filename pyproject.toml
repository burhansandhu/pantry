[project]
name = "recipe-agent"
version = "0.1.0"
description = "A streaming recipe assistant with reviewed ingredient substitutions"
readme = "README.md"
authors = [
    { name = "Burhan ul haq", email = "burhanulhaq60@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "httpx>=0.28,<1",
    "pytest-timeout>=2.4,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recipe_agent*", "backend*"]

[project.scripts]
pantry-cli = "recipe_agent.main:main"



[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
